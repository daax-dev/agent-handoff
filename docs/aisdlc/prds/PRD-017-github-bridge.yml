name: "PRD-017: GitHub Inner↔Outer Loop Bridge"
description: "Implement the localsdlc export and import-issue commands that bridge the local AI SDLC inner loop with an outer GitHub PR workflow — pushing branches, creating GitHub PRs with full ChangeSet context, and importing GitHub issues as local tasks."
area: backend
goal: >
  Implement the two bridge commands that connect the local SDLC to GitHub:
  (1) `localsdlc export <changeSetId>` pushes the feature branch and creates
  a GitHub PR with the ChangeSet summary, review results, and decision log as
  the PR body; and (2) `localsdlc import-issue <url>` imports a GitHub issue
  as a local Task. This satisfies the explicit user requirement to work "in
  combination with an outer loop GitHub type AI SDLC via PRs."

output_format: |
  - src/cli/commands/export.ts          — export subcommand implementation
  - src/cli/commands/import-issue.ts    — import-issue subcommand implementation
  - src/bridge/pr-body-builder.ts       — Builds GitHub PR body markdown from ChangeSet
  - src/__tests__/bridge.test.ts        — Unit tests (mock gh CLI calls)

constraints: |
  - All GitHub operations use the gh CLI (pre-installed on developer machine).
    Do NOT use the GitHub REST API directly or store GitHub tokens.
  - export command:
      localsdlc export <changeSetId> [--remote origin] [--draft]

      Pre-conditions (must all pass, else error):
        1. ChangeSet status == "approved" (not merged, not draft)
        2. git remote <remote> exists
        3. gh CLI is on PATH (`gh --version` succeeds)
        4. User is authenticated (`gh auth status` exits 0)

      Steps:
        1. Run: git push <remote> feat/TSK-XXXXXX
        2. Build PR body via PRBodyBuilder.build(changeSetId)
        3. Run: gh pr create \
               --title "<ChangeSet.title>" \
               --body "<pr_body>" \
               --head feat/TSK-XXXXXX \
               --base <ChangeSet.target_branch> \
               [--draft if --draft flag set]
        4. Parse PR URL from gh output.
        5. Update change_sets.github_pr_url = prUrl via PATCH /api/change-sets/:id.
        6. Print: "Created PR: <url>"
        7. Emit SSE event: { type: "exported", changeSetId, prUrl }

  - PR body format (from PRBodyBuilder):
      ## Summary
      <ChangeSet.description>

      ## Changes
      <git diff --stat from worktree>

      ## Review Results
      | Check | Status |
      |-------|--------|
      <check_runs table>

      ### Blocking Comments Resolved
      <list of resolved blocking comments>

      ### Unresolved Advisory Comments
      <list of advisory/nit comments>

      ## Decisions
      <task decisions in DEC-XXXXXX format>

      ---
      *Generated by localsdlc — inner loop ChangeSet: <changeSetId>*

  - import-issue command:
      localsdlc import-issue <github-issue-url>

      Steps:
        1. Parse owner/repo/number from URL.
        2. Run: gh issue view <number> --repo <owner>/<repo> --json title,body,labels,number
        3. Create Task via POST /api/tasks with title = issue title.
        4. Write issue body to .work/tasks/TSK-XXXXXX/spec.md via SpecStore.
        5. Update change_sets.github_issue_url = issueUrl.
        6. Print: "Created TSK_000001 from <url>"

  - Both commands must handle gh CLI errors gracefully: print the error message
    from stderr and exit 1. Do NOT silently ignore gh failures.
  - The domain model already has github_issue_url, github_pr_url, remote_branch
    fields (added in PRD-001) — this PRD populates them.

failure_conditions: |
  - export succeeds when ChangeSet status != "approved" (must reject).
  - gh pr create failure (e.g., auth error) is silently swallowed.
  - PR body contains malformed markdown (triple backtick not closed, etc.).
  - import-issue creates a task but does not write spec.md.
  - github_pr_url is not updated in the DB after successful export.
  - export pushes to the main branch instead of the feature branch.

acceptance: |
  - Criterion: export pre-condition check rejects non-approved ChangeSet.
    Verification: `bun test src/__tests__/bridge.test.ts` — pre-condition test:
    export called with status="draft" returns error "ChangeSet must be approved".

  - Criterion: PRBodyBuilder.build() returns valid markdown with all sections.
    Verification: `bun test src/__tests__/bridge.test.ts` — PR body test:
    build() output contains "## Summary", "## Review Results", "## Decisions".

  - Criterion: export updates change_sets.github_pr_url after success.
    Verification: `bun test src/__tests__/bridge.test.ts` — mock gh CLI returning
    a PR URL; after export, change_sets.github_pr_url is set to that URL.

  - Criterion: import-issue creates Task with correct title.
    Verification: `bun test src/__tests__/bridge.test.ts` — mock gh issue view;
    Task created with title matching issue title.

  - Criterion: import-issue writes issue body to spec.md.
    Verification: `bun test src/__tests__/bridge.test.ts` — spec file test:
    SpecStore.read(taskId, "spec") returns the issue body content.

  - Criterion: export --dry-run prints what would be done without calling gh.
    Verification: `bun run src/cli/localsdlc.ts export chg_000001 --dry-run`
    prints "Would push: feat/TSK-000001" and "Would create PR with body: ..."
    without running gh.

out_of_scope: |
  - Automated GitHub Actions triggering from the local loop.
  - Importing GitHub PR review comments back into local review_comments table.
  - Multi-remote support (single --remote flag only).
  - GitHub Enterprise (github.com only).

reuse_map: |
  - Extends: PRD-016 localsdlc CLI (adds export + import-issue as subcommands).
  - Uses: PRD-003 SpecStore (writes spec.md from GitHub issue body).
  - Uses: PRD-012 DecisionEntry CRUD (reads decisions for PR body).
  - Uses: PRD-010 ReviewComment CRUD (reads comments for PR body).
  - Uses: PRD-011 CheckRun CRUD (reads check runs for PR body).
  - Uses: PRD-002 WorktreeManager (for diff stat in PR body).

decisions_cited:
  - DEC-010  # CLI bridge commands: localsdlc export + import-issue

backlog_ref: none
