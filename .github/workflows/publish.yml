name: Publish to npm

on:
  release:
    types: [published]

# Trusted publishing: OIDC replaces long-lived NPM_TOKEN.
# Setup: npmjs.com → @daax-dev/agent-handoff → Settings → Trusted Publisher
#   - Provider: GitHub Actions
#   - Organization: daax-dev
#   - Repository: agent-handoff
#   - Workflow: publish.yml

permissions:
  id-token: write
  contents: read

jobs:
  build-and-test:
    uses: ./.github/workflows/_build-and-test.yml

  publish:
    runs-on: self-hosted
    needs: [build-and-test]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Sync version from release tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          npm version "$VERSION" --no-git-tag-version --allow-same-version

      - name: Build
        run: bun run build

      - name: Publish to npm
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_SECRET }}
